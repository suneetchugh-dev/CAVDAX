<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B20" />
      <stop offset="50%" stop-color="#101216" />
      <stop offset="100%" stop-color="#0B0D0F" />
    </linearGradient>

    <!-- Edge / Glow Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield Polygon -->
  <polygon points="50,6 88,22 88,58 50,94 12,58 12,22" 
           fill="url(#shieldBg)" 
           stroke="#2A303C" 
           stroke-width="2" />

  <!-- Inner Cyan Accent Shield Rim -->
  <polygon points="50,12 82,26 82,55 50,86 18,55 18,26" 
           fill="none" 
           stroke="url(#cyanAccent)" 
           stroke-width="1.2" 
           stroke-opacity="0.6" 
           stroke-dasharray="2 2" />

  <!-- Directed Causal Edges (DAG Paths) -->
  <!-- Source -> Left Fact -->
  <line x1="50" y1="26" x2="30" y2="48" stroke="#475569" stroke-width="1.8" />
  <!-- Source -> Right Fact -->
  <line x1="50" y1="26" x2="70" y2="48" stroke="#475569" stroke-width="1.8" />
  <!-- Left Fact -> Decision Target -->
  <line x1="30" y1="48" x2="50" y2="70" stroke="url(#cyanAccent)" stroke-width="2" />
  <!-- Right Fact -> Decision Target -->
  <line x1="70" y1="48" x2="50" y2="70" stroke="url(#cyanAccent)" stroke-width="2" />

  <!-- Central MCP Protocol Execution Diamond -->
  <polygon points="50,42 56,48 50,54 44,48" 
           fill="#06B6D4" 
           fill-opacity="0.25" 
           stroke="#38BDF8" 
           stroke-width="1.5" />

  <!-- Graph Nodes -->
  <!-- Top Node: (:Source) ADR -->
  <circle cx="50" cy="26" r="5.5" fill="#1E293B" stroke="#94A3B8" stroke-width="1.8" />
  <circle cx="50" cy="26" r="2.5" fill="#E2E8F0" />

  <!-- Left Node: (:Fact) -->
  <circle cx="30" cy="48" r="5" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
  <circle cx="30" cy="48" r="2" fill="#94A3B8" />

  <!-- Right Node: (:Fact) -->
  <circle cx="70" cy="48" r="5" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
  <circle cx="70" cy="48" r="2" fill="#94A3B8" />

  <!-- Bottom Node: (:Decision / :AgentAction) Verified Exec Gate -->
  <circle cx="50" cy="70" r="6" fill="#0E2E3B" stroke="#38BDF8" stroke-width="2" filter="url(#nodeGlow)" />
  <circle cx="50" cy="70" r="2.8" fill="#38BDF8" />
</svg>
