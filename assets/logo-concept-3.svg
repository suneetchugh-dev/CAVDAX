<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" fill="none">
  <!-- Concept 3: The Causal Arc ("C") enclosing the Verification Chevron ("V") -->
  <rect width="100" height="100" fill="#0B0D0F" rx="20"/>

  <!-- Path 1: The Outer Causal Conscience Arc ("C") -->
  <path d="M 72 26 L 42 26 A 24 24 0 0 0 42 74 L 72 74" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Path 2: The Inner Verified Decision Chevron ("V" rotated as Forward Execution Vector ">") -->
  <path d="M 44 38 L 66 50 L 44 62" 
        stroke="#38BDF8" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Path 3: The Directed Causal Grounding Spine -->
  <line x1="28" y1="50" x2="44" y2="50" 
        stroke="#38BDF8" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Grounding Node -->
  <circle cx="28" cy="50" r="3.5" fill="#FFFFFF"/>
</svg>
