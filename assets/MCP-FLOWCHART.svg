<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mcpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0E131A"/>
    </linearGradient>
    <linearGradient id="falkorBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1733"/>
      <stop offset="100%" stop-color="#120E22"/>
    </linearGradient>
    <linearGradient id="redGateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#331018"/>
      <stop offset="100%" stop-color="#1A080C"/>
    </linearGradient>
    <linearGradient id="greenGateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F3322"/>
      <stop offset="100%" stop-color="#081A12"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="mcpCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06B6D4"/>
    </marker>
    <marker id="mcpRose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F43F5E"/>
    </marker>
    <marker id="mcpEmerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981"/>
    </marker>
    <marker id="mcpPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A855F7"/>
    </marker>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="960" height="640" fill="url(#mcpBg)" rx="12"/>
  <rect width="958" height="638" x="1" y="1" fill="none" stroke="#30363D" stroke-width="1.5" rx="12"/>

  <!-- Top Title Header -->
  <rect x="24" y="20" width="912" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="48" cy="44" r="10" fill="#F43F5E" opacity="0.2"/>
  <circle cx="48" cy="44" r="5" fill="#F43F5E"/>
  <text x="70" y="49" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">Enclosed MCP Protocol Execution Gate: Deterministic Code Protection</text>
  <rect x="740" y="32" width="180" height="24" rx="12" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
  <text x="830" y="48" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Model Context Protocol</text>

  <!-- ==================== STAGE 1: AGENT RUNTIME & REQUEST ==================== -->
  <g transform="translate(24, 86)">
    <rect width="260" height="400" rx="8" fill="url(#cardGrad2)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="26" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. AGENT RUNTIME</text>

    <!-- Agent Box -->
    <rect x="16" y="42" width="228" height="74" rx="6" fill="#0D1926" stroke="#0284C7" stroke-width="1.5"/>
    <text x="28" y="66" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Autonomous Coding Agent</text>
    <text x="28" y="84" fill="#38BDF8" font-family="monospace" font-size="11">Claude Code / Cursor</text>
    <text x="28" y="100" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Decides code mutation</text>

    <!-- MCP Tool Invocation Card -->
    <rect x="16" y="132" width="228" height="150" rx="6" fill="#0A0E17" stroke="#1E293B" stroke-width="1"/>
    <text x="26" y="152" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">apply_code_change({</text>
    <text x="36" y="172" fill="#FBBF24" font-family="monospace" font-size="10">decision_id: "DEC-102",</text>
    <text x="36" y="190" fill="#94A3B8" font-family="monospace" font-size="10">file_path: "payment.js",</text>
    <text x="36" y="208" fill="#94A3B8" font-family="monospace" font-size="10">code_payload: "..."</text>
    <text x="26" y="228" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">})</text>
    <rect x="26" y="240" width="208" height="30" rx="4" fill="#1E293B"/>
    <text x="130" y="259" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Agent cannot bypass wrapper</text>

    <!-- Recovery Loop Inlet -->
    <rect x="16" y="300" width="228" height="84" rx="6" fill="#0C1F17" stroke="#10B981" stroke-width="1"/>
    <text x="26" y="322" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Act IV Recovery Path</text>
    <text x="26" y="340" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Calls: revalidate_decision()</text>
    <text x="26" y="356" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Links to fresh ADR-002</text>
    <text x="26" y="372" fill="#34D399" font-family="monospace" font-size="9">Re-submits with DEC-103</text>
  </g>

  <!-- Arrow from Agent to Gate -->
  <line x1="284" y1="216" x2="322" y2="216" stroke="#06B6D4" stroke-width="2" marker-end="url(#mcpCyan)"/>
  <text x="303" y="206" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">MCP Call</text>

  <!-- ==================== STAGE 2: ENCLOSED MCP GATEWAY (MIDDLE) ==================== -->
  <g transform="translate(324, 86)">
    <rect width="310" height="400" rx="8" fill="url(#falkorBoxGrad)" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="16" y="26" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. FALKORDB CYPHER VERIFICATION</text>

    <!-- Gateway Wrapper Card -->
    <rect x="16" y="42" width="278" height="66" rx="6" fill="#140E26" stroke="#A855F7" stroke-width="1.5"/>
    <text x="28" y="66" fill="#F3E8FF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CAVDAX Enclosed Interceptor</text>
    <text x="28" y="84" fill="#C084FC" font-family="monospace" font-size="11">verifyActionGate(graph, id)</text>
    <text x="28" y="98" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="9">Physically wraps file system write</text>

    <!-- Cypher Traversal Card -->
    <rect x="16" y="122" width="278" height="160" rx="6" fill="#090615" stroke="#6D28D9" stroke-width="1"/>
    <text x="26" y="142" fill="#C4B5FD" font-family="monospace" font-size="10" font-weight="700">Cypher GraphBLAS Traversal:</text>
    <text x="26" y="162" fill="#94A3B8" font-family="monospace" font-size="9">MATCH (d:Decision {id: $id})</text>
    <text x="26" y="178" fill="#94A3B8" font-family="monospace" font-size="9">OPTIONAL MATCH path =</text>
    <text x="36" y="194" fill="#38BDF8" font-family="monospace" font-size="9">(d)-[:DEPENDS_ON*1..4]-&gt;(f)-&gt;(s)</text>
    <text x="26" y="210" fill="#94A3B8" font-family="monospace" font-size="9">WITH dependencies...</text>
    <text x="26" y="226" fill="#F43F5E" font-family="monospace" font-size="9">WHERE ANY(dep.stale = true)</text>
    <rect x="26" y="238" width="258" height="32" rx="4" fill="#170F2E"/>
    <text x="155" y="259" fill="#A78BFA" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Execution Latency: 1.84ms</text>

    <!-- Inspection Evaluation Rule -->
    <rect x="16" y="296" width="278" height="88" rx="6" fill="#140E26" stroke="#4C1D95" stroke-width="1"/>
    <text x="26" y="316" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Deterministic Rule:</text>
    <text x="26" y="334" fill="#FDA4AF" font-family="monospace" font-size="10">IF ANY ancestor superseded</text>
    <text x="36" y="350" fill="#F43F5E" font-family="monospace" font-size="10">↳ HARD REJECT (0 bytes)</text>
    <text x="26" y="368" fill="#34D399" font-family="monospace" font-size="10">ELSE ↳ APPROVE ATOMIC WRITE</text>
  </g>

  <!-- Output Decision Arrows -->
  <path d="M 634 190 L 670 190 L 670 140 L 688 140" fill="none" stroke="#F43F5E" stroke-width="2" marker-end="url(#mcpRose)"/>
  <text x="660" y="130" fill="#F43F5E" font-family="monospace" font-size="9">STALE</text>

  <path d="M 634 310 L 670 310 L 670 360 L 688 360" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#mcpEmerald)"/>
  <text x="660" y="375" fill="#10B981" font-family="monospace" font-size="9">FRESH</text>

  <!-- ==================== STAGE 3: VERDICT & ENFORCEMENT (RIGHT) ==================== -->
  <g transform="translate(690, 86)">
    <!-- Branch A: Hard Reject Box -->
    <rect width="246" height="190" rx="8" fill="url(#redGateGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="16" y="26" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3A. ⛔ ENCLOSED HARD REJECT</text>

    <rect x="16" y="38" width="214" height="34" rx="4" fill="#4C0519"/>
    <text x="123" y="60" fill="#FECDD3" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">BLOCKED_SUPERSEDED_SOURCE</text>

    <text x="16" y="94" fill="#FDA4AF" font-family="monospace" font-size="10">Target File: payment.js</text>
    <text x="16" y="112" fill="#F43F5E" font-family="monospace" font-size="10">Status: ZERO BYTES WRITTEN</text>
    <text x="16" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Violation Path:</text>
    <text x="16" y="146" fill="#FDA4AF" font-family="monospace" font-size="8">ADR-001 (SUPERSEDED) ➔ F-Auth-v1</text>
    <text x="16" y="160" fill="#FDA4AF" font-family="monospace" font-size="8">➔ DEC-102 (INVALIDATED)</text>

    <!-- Feedback arrow to Act IV -->
    <path d="M 123 190 L 123 206 L 15 206 L 15 284" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Branch B: Approved Write Box -->
    <g transform="translate(0, 210)">
      <rect width="246" height="190" rx="8" fill="url(#greenGateGrad)" stroke="#10B981" stroke-width="1.5"/>
      <text x="16" y="26" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3B. ✅ VERIFIED ATOMIC WRITE</text>

      <rect x="16" y="38" width="214" height="34" rx="4" fill="#064E3B"/>
      <text x="123" y="60" fill="#D1FAE5" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">APPROVED_CAUSAL_PROVENANCE</text>

      <text x="16" y="94" fill="#A7F3D0" font-family="monospace" font-size="10">Target File: payment.js</text>
      <text x="16" y="112" fill="#10B981" font-family="monospace" font-size="10">Status: WRITTEN TO DISK</text>
      <text x="16" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Verified Provenance:</text>
      <text x="16" y="146" fill="#A7F3D0" font-family="monospace" font-size="8">ADR-002 (ACTIVE) ➔ F-OAuth2</text>
      <text x="16" y="160" fill="#A7F3D0" font-family="monospace" font-size="8">➔ DEC-103 (VALID) ➔ AgentAction</text>
    </g>
  </g>

  <!-- Bottom Audit Strip -->
  <rect x="24" y="504" width="912" height="114" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="40" y="528" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EMPIRICAL SECURITY GUARANTEE: Why Vector RAG Cannot Compete</text>
  <text x="40" y="550" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Vector RAG retrieves via cosine keyword similarity ("auth", "payment"), returning stale documents 100% of the time in our benchmark.</text>
  <text x="40" y="570" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11">CAVDAX enforces a topological sort over the FalkorDB causal graph: an action CANNOT execute unless all ancestor sources are ACTIVE.</text>
  <text x="40" y="594" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">Result: 10/10 Stale Code Executions Blocked • 1.65ms Average Gate Latency • Zero Production Vulnerabilities.</text>
</svg>