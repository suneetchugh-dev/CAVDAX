    <text x="292" y="216" font-size="11.5" font-weight="600" fill="#CCCCCC">(:Fact {id: 'F-Auth-v1'})</text>
    <text x="292" y="234" font-size="11" fill="#A0A0A0">claim: "TokenAuth Active"</text>
    <text x="292" y="250" font-size="10" font-weight="600" fill="#737373">is_stale: true (CASCADE)</text>

    <!-- Fact New -->
    <rect x="520" y="196" width="205" height="62" rx="0" fill="#181818" stroke="#CCCCCC" stroke-width="1" />
    <text x="532" y="216" font-size="11.5" font-weight="600" fill="#FFFFFF">(:Fact {id: 'F-OAuth2-v2'})</text>
    <text x="532" y="234" font-size="11" fill="#A0A0A0">claim: "OAuth2 Enforced"</text>
    <text x="532" y="250" font-size="10" font-weight="600" fill="#CCCCCC">is_stale: false (FRESH)</text>

