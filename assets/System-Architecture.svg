    <text x="372" y="598" font-size="11" fill="#A0A0A0">• Monochromatic node status encoding</text>
    <text x="372" y="614" font-size="11" fill="#A0A0A0">• Real-time pulsing traversal path tracing</text>

    <!-- Card 3: Cybernetic Terminal -->
