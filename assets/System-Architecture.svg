    <text x="782" y="264" font-size="11" font-weight="600" fill="#FFFFFF">Query 1: verifyActionGate Interceptor</text>
    <text x="782" y="281" font-size="10" fill="#A0A0A0">ANY(ancestors.is_stale == true)?</text>

    <!-- Verdict Split: Hard Block -->
    <rect x="770" y="308" width="255" height="68" rx="0" fill="#181818" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="4 3" />
    <text x="782" y="328" font-size="11.5" font-weight="700" fill="#FFFFFF">[HARD REJECT] Execution Blocked</text>
    <text x="782" y="346" font-size="10" fill="#CCCCCC">• Zero Disk I/O: 0 bytes modified</text>
    <text x="782" y="361" font-size="9.5" fill="#A0A0A0">• Exact causal violation path returned to agent</text>

    <!-- Verdict Split: Approved -->
    <rect x="770" y="390" width="255" height="68" rx="0" fill="#181818" stroke="#CCCCCC" stroke-width="1.2" />
    <text x="782" y="410" font-size="11.5" font-weight="700" fill="#FFFFFF">[APPROVED] Side-Effect Executed</text>
    <text x="782" y="428" font-size="10" fill="#CCCCCC">• Code written atomically to disk</text>
    <text x="782" y="443" font-size="9.5" fill="#A0A0A0">• (:AgentAction)-[:GROUNDED_IN]->(:Decision)</text>
  </g>

  <!-- ================= CROSS-SUBGRAPH CONNECTORS ================= -->
  <!-- Ingestion to FalkorDB Invalidation Wave -->
  <path d="M 230 412 L 255 412 L 255 137 L 276 137" fill="none" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowhead)" />
