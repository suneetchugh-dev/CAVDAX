    <text x="292" y="144" font-size="11" fill="#A0A0A0">title: "TokenAuth v1"</text>
    <text x="292" y="160" font-size="10" font-weight="600" fill="#737373">status: 'SUPERSEDED'</text>

    <!-- Source New -->
    <rect x="520" y="106" width="205" height="62" rx="0" fill="#181818" stroke="#CCCCCC" stroke-width="1" />
    <text x="532" y="126" font-size="11.5" font-weight="600" fill="#FFFFFF">(:Source {id: 'ADR-002'})</text>
    <text x="532" y="144" font-size="11" fill="#A0A0A0">title: "Enforce OAuth2"</text>
    <text x="532" y="160" font-size="10" font-weight="600" fill="#CCCCCC">status: 'ACTIVE'</text>

