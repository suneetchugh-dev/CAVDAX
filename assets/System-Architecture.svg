    <text x="727" y="598" font-size="10.5" font-family="monospace" fill="#A0A0A0">[ACT-IV] Created DEC-103 grounded in ADR-002</text>
    <text x="727" y="614" font-size="10.5" font-family="monospace" fill="#CCCCCC">[MCP] Tool call approved. File updated.</text>
