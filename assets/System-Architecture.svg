<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0E131A"/>
    </linearGradient>
    <linearGradient id="falkorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1528"/>
      <stop offset="100%" stop-color="#100D1C"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1218"/>
      <stop offset="100%" stop-color="#180A0E"/>
    </linearGradient>
    <linearGradient id="approveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2D1F"/>
      <stop offset="100%" stop-color="#091A12"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06B6D4"/>
    </marker>
    <marker id="arrowRose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F43F5E"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A855F7"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="680" fill="url(#bgGrad)" rx="12"/>
  <rect width="958" height="678" x="1" y="1" fill="none" stroke="#30363D" stroke-width="1.5" rx="12"/>

  <!-- Title Header Bar -->
  <rect x="24" y="20" width="912" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="48" cy="44" r="10" fill="#06B6D4" opacity="0.2"/>
  <circle cx="48" cy="44" r="5" fill="#06B6D4"/>
  <text x="70" y="49" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">CAVDAX: End-to-End System Architecture</text>
  <rect x="730" y="32" width="190" height="24" rx="12" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
  <text x="825" y="48" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FalkorDB GraphBLAS &lt; 2ms</text>

  <!-- ==================== LAYER 1: REPOSITORY & INGESTION (TOP) ==================== -->
  <g transform="translate(24, 84)">
    <rect width="912" height="110" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">1. TARGET CODEBASE &amp; DETERMINISTIC INGESTION ENGINE</text>

    <!-- Source Box 1 (ADR-001) -->
    <rect x="16" y="38" width="170" height="56" rx="6" fill="#0C131D" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="26" y="58" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">Source: ADR-001</text>
    <text x="26" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">TokenAuth v1 Policy</text>
    <text x="26" y="86" fill="#64748B" font-family="monospace" font-size="9">status: SUPERSEDED</text>

    <!-- Arrow to Git -->
    <line x1="186" y1="66" x2="228" y2="66" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- Git Commit Box -->
    <rect x="230" y="38" width="160" height="56" rx="6" fill="#1E1B2E" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="240" y="58" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">Git Commit / PR</text>
    <text x="240" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">ADR-002 Added</text>
    <text x="240" y="86" fill="#C084FC" font-family="monospace" font-size="9">supersedes: ADR-001</text>

    <!-- Arrow to Parser -->
    <line x1="390" y1="66" x2="432" y2="66" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <!-- Ingestion Engine Box -->
    <rect x="434" y="38" width="220" height="56" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="444" y="58" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">Deterministic Ingestion</text>
    <text x="444" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">YAML Frontmatter Parser</text>
    <text x="444" y="86" fill="#FBBF24" font-family="monospace" font-size="9">Zero LLM Hops • Instant</text>

    <!-- Arrow to Source 2 -->
    <line x1="654" y1="66" x2="696" y2="66" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- Source Box 2 (ADR-002) -->
    <rect x="698" y="38" width="198" height="56" rx="6" fill="#0C1F17" stroke="#10B981" stroke-width="1.5"/>
    <text x="708" y="58" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">Source: ADR-002</text>
    <text x="708" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Mandatory OAuth2 Policy</text>
    <text x="708" y="86" fill="#34D399" font-family="monospace" font-size="9">status: ACTIVE</text>
  </g>

  <!-- Downward Flow to FalkorDB Engine -->
  <line x1="544" y1="194" x2="544" y2="216" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="552" y="210" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Cascades Invalidation</text>

  <!-- ==================== LAYER 2: FALKORDB CAUSAL DAG (MIDDLE) ==================== -->
  <g transform="translate(24, 218)">
    <rect width="912" height="190" rx="8" fill="url(#falkorGrad)" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="16" y="24" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">2. FALKORDB TEMPORAL CAUSAL GRAPH (GraphBLAS SPARSE MATRIX ENGINE)</text>

    <!-- Causal Nodes Box: Left to Right DAG -->
    <!-- Node S1 -->
    <rect x="24" y="44" width="130" height="50" rx="6" fill="#2E1015" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="89" y="66" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">:Source (ADR-001)</text>
    <text x="89" y="82" fill="#F43F5E" font-family="monospace" font-size="10" text-anchor="middle">SUPERSEDED</text>

    <!-- Edge Supersedes from S2 to S1 -->
    <path d="M 154 69 L 200 69" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrowRose)"/>
    <text x="177" y="62" fill="#F43F5E" font-family="monospace" font-size="9" text-anchor="middle">:SUPERSEDES</text>

    <!-- Node S2 -->
    <rect x="202" y="44" width="130" height="50" rx="6" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
    <text x="267" y="66" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">:Source (ADR-002)</text>
    <text x="267" y="82" fill="#10B981" font-family="monospace" font-size="10" text-anchor="middle">ACTIVE (OAuth2)</text>

    <!-- Edge Extracted From S1 to F1 -->
    <line x1="89" y1="94" x2="89" y2="124" stroke="#F43F5E" stroke-width="1.5" marker-end="url(#arrowRose)"/>
    <text x="94" y="112" fill="#FDA4AF" font-family="monospace" font-size="8">:EXTRACTED</text>

    <!-- Node F1 (Stale Fact) -->
    <rect x="24" y="126" width="130" height="46" rx="6" fill="#2E1015" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="89" y="146" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">:Fact (F-Auth-v1)</text>
    <text x="89" y="161" fill="#F43F5E" font-family="monospace" font-size="9" text-anchor="middle">is_stale: true</text>

    <!-- Edge Extracted From S2 to F2 -->
    <line x1="267" y1="94" x2="267" y2="124" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
    <text x="272" y="112" fill="#A7F3D0" font-family="monospace" font-size="8">:EXTRACTED</text>

    <!-- Node F2 (Active Fact) -->
    <rect x="202" y="126" width="130" height="46" rx="6" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
    <text x="267" y="146" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">:Fact (F-OAuth2)</text>
    <text x="267" y="161" fill="#10B981" font-family="monospace" font-size="9" text-anchor="middle">verified: true</text>

    <!-- Query Engine Highlights on Right Half of Middle Layer -->
    <rect x="360" y="38" width="536" height="136" rx="6" fill="#120E22" stroke="#6D28D9" stroke-width="1"/>
    <text x="374" y="58" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SUB-3MS CYPHER ENGINE (FalkorDB GraphBLAS Matrix Ops)</text>

    <!-- Query 1 Card -->
    <rect x="374" y="68" width="160" height="96" rx="4" fill="#1E1933" stroke="#8B5CF6" stroke-width="1"/>
    <text x="382" y="86" fill="#A78BFA" font-family="monospace" font-size="10" font-weight="700">Query 1: Action Gate</text>
    <text x="382" y="102" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">ANY(...) Aggregation</text>
    <text x="382" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Inspects full ancestry</text>
    <rect x="382" y="128" width="144" height="26" rx="3" fill="#0C0A17"/>
    <text x="454" y="145" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Latency: 1.84ms</text>

    <!-- Query 2 Card -->
    <rect x="548" y="68" width="160" height="96" rx="4" fill="#1E1933" stroke="#8B5CF6" stroke-width="1"/>
    <text x="556" y="86" fill="#A78BFA" font-family="monospace" font-size="10" font-weight="700">Query 2: Invalidation</text>
    <text x="556" y="102" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">[:SUPERSEDES] cascade</text>
    <text x="556" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Invalidates stale facts</text>
    <rect x="556" y="128" width="144" height="26" rx="3" fill="#0C0A17"/>
    <text x="628" y="145" fill="#F43F5E" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Cascade: 2.14ms</text>

    <!-- Query 3 Card -->
    <rect x="722" y="68" width="160" height="96" rx="4" fill="#1E1933" stroke="#8B5CF6" stroke-width="1"/>
    <text x="730" y="86" fill="#A78BFA" font-family="monospace" font-size="10" font-weight="700">Query 3: Revalidation</text>
    <text x="730" y="102" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Act IV closed loop</text>
    <text x="730" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">DEC-103 synthesized</text>
    <rect x="730" y="128" width="144" height="26" rx="3" fill="#0C0A17"/>
    <text x="802" y="145" fill="#10B981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Revalidate: 1.62ms</text>
  </g>

  <!-- ==================== LAYER 3: ENCLOSED MCP GATE & AGENT EXECUTION (BOTTOM) ==================== -->
  <g transform="translate(24, 426)">
    <!-- Left Box: Agent & MCP Gate -->
    <rect width="570" height="230" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">3. ENCLOSED MCP EXECUTION GATE (apply_code_change)</text>

    <!-- Agent Box -->
    <rect x="16" y="42" width="150" height="60" rx="6" fill="#0D1926" stroke="#0284C7" stroke-width="1.5"/>
    <text x="91" y="64" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Coding Agent</text>
    <text x="91" y="80" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Claude Code / Cursor</text>
    <text x="91" y="93" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Invokes tool</text>

    <!-- Arrow to Enclosed Gate -->
    <line x1="166" y1="72" x2="206" y2="72" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- Enclosed Gate Barrier -->
    <rect x="208" y="42" width="150" height="60" rx="6" fill="#181329" stroke="#A855F7" stroke-width="1.5"/>
    <text x="283" y="64" fill="#F3E8FF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Enclosed Gate</text>
    <text x="283" y="80" fill="#C084FC" font-family="monospace" font-size="10" text-anchor="middle">verifyActionGate()</text>
    <text x="283" y="93" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Internal Cypher check</text>

    <!-- Split Flow: Branch A (Blocked) vs Branch B (Approved) -->
    <!-- Branch A: Blocked -->
    <path d="M 358 60 L 388 60 L 388 40 L 406 40" fill="none" stroke="#F43F5E" stroke-width="1.5" marker-end="url(#arrowRose)"/>
    <rect x="408" y="24" width="148" height="46" rx="4" fill="url(#blockGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="482" y="42" fill="#FDA4AF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">⛔ HARD REJECT</text>
    <text x="482" y="58" fill="#F43F5E" font-family="monospace" font-size="8" text-anchor="middle">BLOCKED_SUPERSEDED_SOURCE</text>

    <!-- Branch B: Approved -->
    <path d="M 358 84 L 388 84 L 388 95 L 406 95" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
    <rect x="408" y="76" width="148" height="46" rx="4" fill="url(#approveGrad)" stroke="#10B981" stroke-width="1.5"/>
    <text x="482" y="94" fill="#A7F3D0" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">✅ APPROVED WRITE</text>
    <text x="482" y="110" fill="#10B981" font-family="monospace" font-size="8" text-anchor="middle">payment.js updated</text>

    <!-- Terminal Output Panel Inside Gate -->
    <rect x="16" y="130" width="540" height="88" rx="6" fill="#05070A" stroke="#1E293B" stroke-width="1"/>
    <text x="28" y="148" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">[TERMINAL INTERCEPTION AUDIT LOG]</text>
    <text x="28" y="166" fill="#F43F5E" font-family="monospace" font-size="10">↳ [ACT III BLOCKED]: Decision 'DEC-102' is grounded in superseded 'ADR-001'. Zero bytes written.</text>
    <text x="28" y="184" fill="#34D399" font-family="monospace" font-size="10">↳ [ACT IV APPROVED]: Decision 'DEC-103' grounded in 'ADR-002' verified. OAuth2 code written.</text>
    <text x="28" y="202" fill="#64748B" font-family="monospace" font-size="9">Audit node AgentAction(:EXECUTED) persisted in FalkorDB with timestamp signature.</text>
  </g>

  <!-- Right Box: Porcelain Dark Web HUD -->
  <g transform="translate(610, 426)">
    <rect width="326" height="230" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="24" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">4. PORCELAIN DARK WEB HUD</text>

    <rect x="16" y="42" width="294" height="34" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="26" y="63" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">4-Act Storyline Stepper</text>
    <text x="235" y="63" fill="#10B981" font-family="monospace" font-size="10">Interactive</text>

    <rect x="16" y="84" width="294" height="42" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="26" y="102" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dynamic SVG Graph Canvas</text>
    <text x="26" y="117" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Color-coded glowing nodes &amp; edge pulse</text>

    <rect x="16" y="134" width="294" height="42" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="26" y="152" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cybernetic Agent Console</text>
    <text x="26" y="167" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Live SSE event stream from backend</text>

    <rect x="16" y="184" width="294" height="34" rx="4" fill="#0C1F17" stroke="#10B981" stroke-width="1"/>
    <text x="163" y="205" fill="#34D399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">http://localhost:5173</text>
  </g>
</svg>