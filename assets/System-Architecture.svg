  <!-- ================= SUBGRAPH 3: ENCLOSED MCP GATE (Right) ================= -->
  <g class="subgraph">
    <rect x="755" y="64" width="285" height="425" rx="0" fill="#1F1F1F" stroke="#666666" stroke-width="1" />
