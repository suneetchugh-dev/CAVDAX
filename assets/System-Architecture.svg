    <rect x="348" y="266" width="68" height="16" rx="0" fill="#1F1F1F" stroke="#3D3D3D" stroke-width="0.75" />
    <text x="382" y="278" font-size="8.5" fill="#A0A0A0" text-anchor="middle">[:DEPENDS_ON]</text>

    <line x1="622" y1="286" x2="622" y2="262" stroke="#CCCCCC" stroke-width="1" marker-end="url(#arrowhead)" />
    <rect x="588" y="266" width="68" height="16" rx="0" fill="#1F1F1F" stroke="#3D3D3D" stroke-width="0.75" />
    <text x="622" y="278" font-size="8.5" fill="#A0A0A0" text-anchor="middle">[:DEPENDS_ON]</text>

    <!-- REPLACES EDGE (DEC-103 -> DEC-102) -->
    <line x1="520" y1="318" x2="489" y2="318" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
    <rect x="447" y="308" width="68" height="18" rx="0" fill="#1F1F1F" stroke="#3D3D3D" stroke-width="0.75" />
    <text x="481" y="321" font-size="8.5" font-weight="600" fill="#CCCCCC" text-anchor="middle">[:REPLACES]</text>

