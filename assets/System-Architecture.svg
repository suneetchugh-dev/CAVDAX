<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--surface:#181818;--border:#CCCCCC;background:#1F1F1F;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="#CCCCCC" stroke="#CCCCCC" stroke-width="0.75" stroke-linejoin="round" />
    </marker>
    <marker id="arrowhead-accent" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="#0078D4" stroke="#0078D4" stroke-width="0.75" stroke-linejoin="round" />
    </marker>
    <marker id="arrowhead-muted" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="#777777" stroke="#777777" stroke-width="0.75" stroke-linejoin="round" />
    </marker>
  </defs>
  

  <!-- TITLE BAR -->
  <rect x="20" y="14" width="1020" height="38" rx="0" fill="#181818" stroke="#CCCCCC" stroke-width="1" />
  <text x="36" y="38" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">CAVDAX: End-to-End System Architecture (FalkorDB Causal DAG &amp; Enclosed MCP Gate)</text>
  <rect x="910" y="22" width="118" height="22" rx="0" fill="#1F1F1F" stroke="#666666" stroke-width="1" />
  <text x="969" y="37" font-size="10.5" font-weight="600" fill="#CCCCCC" text-anchor="middle">GRAPHBLAS DAG</text>

  <!-- ================= SUBGRAPH 1: INGESTION (Left) ================= -->
  <g class="subgraph">
    <rect x="20" y="64" width="225" height="425" rx="0" fill="#1F1F1F" stroke="#666666" stroke-width="1" />
    <rect x="20" y="64" width="225" height="28" rx="0" fill="#282828" stroke="#666666" stroke-width="1" />
    <text x="32" y="83" font-size="12" font-weight="600" fill="#FFFFFF">1. Real Multi-Source Ingestion</text>

    <!-- Node: ADR-001 -->
    <rect x="35" y="106" width="195" height="56" rx="0" fill="#181818" stroke="#666666" stroke-width="0.75" stroke-dasharray="3 3" />
    <text x="47" y="126" font-size="12" font-weight="600" fill="#CCCCCC">Real ADR: ADR-001.md</text>
    <text x="47" y="146" font-size="11" fill="#A0A0A0">Auth v1 Active (Original)</text>

    <!-- Node: ADR-002 -->
    <rect x="35" y="174" width="195" height="64" rx="0" fill="#181818" stroke="#CCCCCC" stroke-width="1" />
    <text x="47" y="194" font-size="12" font-weight="600" fill="#FFFFFF">New ADR: ADR-002.md</text>
    <text x="47" y="212" font-size="11" fill="#CCCCCC">supersedes: ADR-001</text>
    <text x="47" y="228" font-size="10" fill="#A0A0A0">Enforce OAuth2 Security</text>

    <!-- Node: Git Commit / Webhook -->
    <rect x="35" y="250" width="195" height="52" rx="0" fill="#181818" stroke="#666666" stroke-width="0.75" />
    <text x="47" y="270" font-size="12" font-weight="600" fill="#CCCCCC">Real Git Commit / Webhook</text>
    <text x="47" y="289" font-size="11" fill="#A0A0A0">SHA: 9f8a2b (main branch)</text>

    <!-- Node: YAML Frontmatter Parser -->
    <rect x="35" y="314" width="195" height="64" rx="0" fill="#181818" stroke="#CCCCCC" stroke-width="1" />
    <text x="47" y="334" font-size="12" font-weight="600" fill="#FFFFFF">YAML Metadata Parser</text>
    <text x="47" y="352" font-size="11" fill="#CCCCCC">Deterministic AST Extraction</text>
    <text x="47" y="367" font-size="10" fill="#737373">Zero Probabilistic LLM Hops</text>

    <!-- Node: Ingestion Wave Trigger -->
