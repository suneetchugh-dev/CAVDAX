  <line x1="897" y1="230" x2="897" y2="240" stroke="#CCCCCC" stroke-width="1" marker-end="url(#arrowhead)" />

  <!-- Cypher Gate into FalkorDB Query 1 -->
  <path d="M 770 269 L 740 269 L 740 318 L 729 318" fill="none" stroke="#CCCCCC" stroke-width="1" marker-end="url(#arrowhead)" />
  <rect x="718" y="280" width="44" height="18" rx="0" fill="#1F1F1F" stroke="#3D3D3D" stroke-width="0.75" />
  <text x="740" y="292" font-size="8.5" fill="#A0A0A0" text-anchor="middle">1.84ms</text>

  <!-- Rejected feedback back to Agent (Loop) -->
  <path d="M 1025 342 L 1045 342 L 1045 133 L 1029 133" fill="none" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
  <rect x="1018" y="230" width="40" height="18" rx="0" fill="#1F1F1F" stroke="#3D3D3D" stroke-width="0.75" />
  <text x="1038" y="242" font-size="8.5" fill="#A0A0A0" text-anchor="middle">RETRY</text>

