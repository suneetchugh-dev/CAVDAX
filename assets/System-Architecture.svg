    <line x1="382" y1="196" x2="382" y2="172" stroke="#CCCCCC" stroke-width="1" marker-end="url(#arrowhead)" />
    <rect x="338" y="176" width="88" height="16" rx="0" fill="#1F1F1F" stroke="#3D3D3D" stroke-width="0.75" />
    <text x="382" y="188" font-size="8.5" fill="#A0A0A0" text-anchor="middle">[:EXTRACTED_FROM]</text>

    <line x1="622" y1="196" x2="622" y2="172" stroke="#CCCCCC" stroke-width="1" marker-end="url(#arrowhead)" />
    <rect x="578" y="176" width="88" height="16" rx="0" fill="#1F1F1F" stroke="#3D3D3D" stroke-width="0.75" />
    <text x="622" y="188" font-size="8.5" fill="#A0A0A0" text-anchor="middle">[:EXTRACTED_FROM]</text>

    <!-- ROW 3: DECISIONS -->
    <!-- Decision Old -->
    <rect x="280" y="286" width="205" height="64" rx="0" fill="#181818" stroke="#666666" stroke-width="1" stroke-dasharray="3 3" />
    <text x="292" y="306" font-size="11.5" font-weight="600" fill="#CCCCCC">(:Decision {id: 'DEC-102'})</text>
    <text x="292" y="324" font-size="11" fill="#A0A0A0">title: "Implement TokenAuth"</text>
    <text x="292" y="340" font-size="9.5" font-weight="600" fill="#737373">status: 'INVALIDATED'</text>

    <!-- Decision New -->
    <rect x="520" y="286" width="205" height="64" rx="0" fill="#181818" stroke="#CCCCCC" stroke-width="1" />
    <text x="532" y="306" font-size="11.5" font-weight="600" fill="#FFFFFF">(:Decision {id: 'DEC-103'})</text>
    <text x="532" y="324" font-size="11" fill="#A0A0A0">title: "Implement OAuth2"</text>
    <text x="532" y="340" font-size="9.5" font-weight="600" fill="#CCCCCC">status: 'VALID' (Act IV)</text>

