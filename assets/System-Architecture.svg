    <text x="47" y="408" font-size="11" font-weight="600" fill="#FFFFFF">Query 2: Invalidation Wave</text>
    <text x="47" y="424" font-size="10" fill="#A0A0A0">Cascades Invalidation &lt; 3ms</text>
  </g>

