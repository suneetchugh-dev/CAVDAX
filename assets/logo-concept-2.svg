<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" fill="none">
  <!-- Concept 2: The Hexagonal Causal Confluence -->
  <rect width="100" height="100" fill="#0B0D0F" rx="20"/>

  <!-- Top-Left Flow: Causal Origin (Source -> Fact) -->
  <path d="M 50 18 L 24 33 L 24 67 A 17 17 0 0 0 50 67" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Bottom-Right Flow: Verification Gate (Decision -> Action) -->
  <path d="M 50 82 L 76 67 L 76 33 A 17 17 0 0 0 50 33" 
        stroke="#38BDF8" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Central Causal DAG Spine -->
  <line x1="50" y1="33" x2="50" y2="67" 
        stroke="#E2E8F0" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-dasharray="2 4"/>

  <!-- Core Diamond Gate -->
  <polygon points="50,45 55,50 50,55 45,50" fill="#38BDF8"/>
</svg>
