<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" fill="none">
  <!-- Concept 4: The Interlocking C-V-X Causal Confluence (Master Geometric Mark) -->
  <rect width="100" height="100" fill="#0B0D0F" rx="20"/>

  <!-- Stroke 1: Top Causal Loop (C) -->
  <path d="M 75 26 L 40 26 A 16 16 0 0 0 40 58 L 56 50" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Stroke 2: Bottom Verification Loop (V) -->
  <path d="M 25 74 L 60 74 A 16 16 0 0 0 60 42 L 44 50" 
