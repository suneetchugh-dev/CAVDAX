<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Act Card Gradients -->
    <linearGradient id="act1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C1D29"/>
      <stop offset="100%" stop-color="#08131C"/>
    </linearGradient>
    <linearGradient id="act2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241B0F"/>
      <stop offset="100%" stop-color="#140F08"/>
    </linearGradient>
    <linearGradient id="act3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1117"/>
      <stop offset="100%" stop-color="#1A090D"/>
    </linearGradient>
    <linearGradient id="act4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2D1F"/>
      <stop offset="100%" stop-color="#081A12"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="actArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
    <marker id="actCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06B6D4"/>
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect width="960" height="580" fill="url(#flowBg)" rx="12"/>
  <rect width="958" height="578" x="1" y="1" fill="none" stroke="#30363D" stroke-width="1.5" rx="12"/>

  <!-- Top Title Header -->
  <rect x="24" y="20" width="912" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="48" cy="44" r="10" fill="#10B981" opacity="0.2"/>
  <circle cx="48" cy="44" r="5" fill="#10B981"/>
  <text x="70" y="49" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">The 4-Act Causal DAG State Transition Lifecycle</text>
  <rect x="740" y="32" width="180" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="830" y="48" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Deterministic State Machine</text>

  <!-- ==================== 4 COLUMNS: THE 4 ACTS ==================== -->

  <!-- ACT I: BASELINE -->
  <g transform="translate(24, 86)">
    <rect width="216" height="380" rx="8" fill="url(#act1Grad)" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="12" y="12" width="192" height="28" rx="4" fill="#0369A1"/>
    <text x="108" y="31" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ACT I: BASELINE</text>

    <text x="16" y="62" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Initial Stable State</text>
    <text x="16" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">ADR-001 accepted into repo.</text>

    <!-- Node 1: S1 -->
    <rect x="16" y="96" width="184" height="48" rx="6" fill="#0A1826" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="26" y="116" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">Source: ADR-001</text>
    <text x="26" y="132" fill="#94A3B8" font-family="monospace" font-size="10">status: ACTIVE</text>

    <line x1="108" y1="144" x2="108" y2="168" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#actCyan)"/>

    <!-- Node 2: F1 -->
    <rect x="16" y="170" width="184" height="48" rx="6" fill="#18142A" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="26" y="190" fill="#C084FC" font-family="monospace" font-size="11" font-weight="700">Fact: F-Auth-v1</text>
    <text x="26" y="206" fill="#94A3B8" font-family="monospace" font-size="10">is_stale: false</text>

    <line x1="108" y1="218" x2="108" y2="242" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#actCyan)"/>

    <!-- Node 3: D1 -->
    <rect x="16" y="244" width="184" height="48" rx="6" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
    <text x="26" y="264" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">Decision: DEC-102</text>
    <text x="26" y="280" fill="#10B981" font-family="monospace" font-size="10">status: VALID</text>

    <rect x="16" y="310" width="184" height="54" rx="6" fill="#08131C" stroke="#0284C7" stroke-width="1"/>
    <text x="26" y="330" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">Gate Verdict:</text>
    <text x="26" y="348" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">✅ APPROVED</text>
  </g>

  <!-- ACT II: INGESTION CASCADE -->
  <g transform="translate(256, 86)">
    <rect width="216" height="380" rx="8" fill="url(#act2Grad)" stroke="#D97706" stroke-width="1.5"/>
    <rect x="12" y="12" width="192" height="28" rx="4" fill="#B45309"/>
    <text x="108" y="31" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ACT II: INGESTION</text>

    <text x="16" y="62" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Commit Mutation Ingested</text>
    <text x="16" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">ADR-002 supersedes ADR-001</text>

    <!-- Node 1: S1 Superseded -->
    <rect x="16" y="96" width="184" height="48" rx="6" fill="#331016" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="26" y="116" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="700">Source: ADR-001</text>
    <text x="26" y="132" fill="#F43F5E" font-family="monospace" font-size="10">SUPERSEDED ⚡</text>

    <line x1="108" y1="144" x2="108" y2="168" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Node 2: F1 Stale -->
    <rect x="16" y="170" width="184" height="48" rx="6" fill="#331016" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="26" y="190" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="700">Fact: F-Auth-v1</text>
    <text x="26" y="206" fill="#F43F5E" font-family="monospace" font-size="10">is_stale: TRUE ⚡</text>

    <line x1="108" y1="218" x2="108" y2="242" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Node 3: D1 Invalidated -->
    <rect x="16" y="244" width="184" height="48" rx="6" fill="#331016" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="26" y="264" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="700">Decision: DEC-102</text>
    <text x="26" y="280" fill="#F43F5E" font-family="monospace" font-size="10">INVALIDATED ⚡</text>

    <rect x="16" y="310" width="184" height="54" rx="6" fill="#140F08" stroke="#D97706" stroke-width="1"/>
    <text x="26" y="330" fill="#FBBF24" font-family="monospace" font-size="10" font-weight="700">Query 2 Latency:</text>
    <text x="26" y="348" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="700">⚡ 2.14ms Cascade</text>
  </g>

  <!-- ACT III: ENCLOSED MCP GATE INTERCEPTION -->
  <g transform="translate(488, 86)">
    <rect width="216" height="380" rx="8" fill="url(#act3Grad)" stroke="#E11D48" stroke-width="1.5"/>
    <rect x="12" y="12" width="192" height="28" rx="4" fill="#BE123C"/>
    <text x="108" y="31" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ACT III: MCP REJECT</text>

    <text x="16" y="62" fill="#FB7185" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Agent Invokes Tool</text>
    <text x="16" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Tries apply_code_change</text>

    <rect x="16" y="96" width="184" height="74" rx="6" fill="#240A10" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="26" y="118" fill="#FDA4AF" font-family="monospace" font-size="10" font-weight="700">Tool Call:</text>
    <text x="26" y="134" fill="#FFFFFF" font-family="monospace" font-size="9">apply_code_change({</text>
    <text x="36" y="148" fill="#F43F5E" font-family="monospace" font-size="9">decision_id: "DEC-102"</text>
    <text x="26" y="162" fill="#FFFFFF" font-family="monospace" font-size="9">})</text>

    <!-- Gate Barrier -->
    <rect x="16" y="182" width="184" height="66" rx="6" fill="#3F121C" stroke="#F43F5E" stroke-width="2"/>
    <text x="108" y="206" fill="#FECDD3" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ HARD REJECT</text>
    <text x="108" y="224" fill="#FDA4AF" font-family="monospace" font-size="9" text-anchor="middle">STALE PROVENANCE DETECTED</text>
    <text x="108" y="238" fill="#F43F5E" font-family="monospace" font-size="9" text-anchor="middle">Zero Bytes Modified</text>

    <rect x="16" y="260" width="184" height="104" rx="6" fill="#1A090D" stroke="#E11D48" stroke-width="1"/>
    <text x="26" y="280" fill="#FDA4AF" font-family="monospace" font-size="10" font-weight="700">Gate Verification:</text>
    <text x="26" y="298" fill="#F43F5E" font-family="monospace" font-size="10">Latency: 1.84ms</text>
    <text x="26" y="316" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Violation path returned to agent.</text>
    <text x="26" y="332" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Target file protected.</text>
    <text x="26" y="348" fill="#FBBF24" font-family="monospace" font-size="9">Reroutes to Act IV ➔</text>
  </g>

  <!-- ACT IV: REVALIDATION & EXECUTION -->
  <g transform="translate(720, 86)">
    <rect width="216" height="380" rx="8" fill="url(#act4Grad)" stroke="#059669" stroke-width="1.5"/>
    <rect x="12" y="12" width="192" height="28" rx="4" fill="#047857"/>
    <text x="108" y="31" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ACT IV: VERIFIED</text>

    <text x="16" y="62" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Revalidation Loop</text>
    <text x="16" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Synthesizes DEC-103</text>

    <!-- Node 1: S2 -->
    <rect x="16" y="96" width="184" height="48" rx="6" fill="#052418" stroke="#10B981" stroke-width="1.5"/>
    <text x="26" y="116" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="700">Source: ADR-002</text>
    <text x="26" y="132" fill="#10B981" font-family="monospace" font-size="10">status: ACTIVE</text>

    <line x1="108" y1="144" x2="108" y2="168" stroke="#10B981" stroke-width="1.5" marker-end="url(#actCyan)"/>

    <!-- Node 2: F2 -->
    <rect x="16" y="170" width="184" height="48" rx="6" fill="#052418" stroke="#10B981" stroke-width="1.5"/>
    <text x="26" y="190" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="700">Fact: F-OAuth2</text>
    <text x="26" y="206" fill="#10B981" font-family="monospace" font-size="10">verified: TRUE</text>

    <line x1="108" y1="218" x2="108" y2="242" stroke="#10B981" stroke-width="1.5" marker-end="url(#actCyan)"/>

    <!-- Node 3: D2 -->
    <rect x="16" y="244" width="184" height="48" rx="6" fill="#052418" stroke="#10B981" stroke-width="1.5"/>
    <text x="26" y="264" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="700">Decision: DEC-103</text>
    <text x="26" y="280" fill="#10B981" font-family="monospace" font-size="10">REPLACES DEC-102</text>

    <rect x="16" y="310" width="184" height="54" rx="6" fill="#081A12" stroke="#059669" stroke-width="1"/>
    <text x="26" y="330" fill="#34D399" font-family="monospace" font-size="10" font-weight="700">Gate Verdict:</text>
    <text x="26" y="348" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">✅ APPROVED (1.62ms)</text>
  </g>

  <!-- Bottom Legend Bar -->
  <rect x="24" y="482" width="912" height="76" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="40" y="508" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">WHY GRAPHBLAS TEMPORAL CAUSALITY MATTERS</text>
  <text x="40" y="528" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">FalkorDB executes multi-hop causal graph traversals in &lt; 2 milliseconds using linear-algebraic sparse matrix multiplication.</text>
  <text x="40" y="546" fill="#38BDF8" font-family="monospace" font-size="10">Vector search measures semantic similarity; FalkorDB proves historical and causal truth.</text>
</svg>