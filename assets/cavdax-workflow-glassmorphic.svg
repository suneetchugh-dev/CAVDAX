<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>

    <!-- Glass Gradients -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="glass-card-alert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450A0A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1C0A0A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glass-card-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ambient-sphere" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="120" result="blur"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00F0FF"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A855F7"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 26px; fill: #F8FAFC; letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 14px; fill: #94A3B8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #F1F5F9; }
    .card-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #94A3B8; }
    .code { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #00F0FF; }
    .code-red { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #FCA5A5; }
    .code-green { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #6EE7B7; }
    .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="200" r="180" fill="#0284C7" opacity="0.18" filter="url(#ambient-sphere)"/>
  <circle cx="700" cy="450" r="240" fill="#6366F1" opacity="0.15" filter="url(#ambient-sphere)"/>
  <circle cx="1200" cy="700" r="220" fill="#10B981" opacity="0.16" filter="url(#ambient-sphere)"/>
  <circle cx="1200" cy="300" r="180" fill="#EF4444" opacity="0.18" filter="url(#ambient-sphere)"/>

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-opacity="0.4"/>
    <text x="40" y="16" class="badge" fill="#00F0FF" text-anchor="middle">WORKFLOW</text>
    <text x="96" y="20" class="title">CAVDAX: Causal Invalidation &amp; Enclosed Action Gate</text>
    <text x="0" y="46" class="subtitle">Complete Closed-Loop Lifecycle: Multi-Source Ingestion &gt; FalkorDB GraphBLAS Cascade &gt; Enclosed MCP Gate &gt; Act IV Revalidation</text>
  </g>

  <!-- ================= STAGE 1: REAL INGESTION ================= -->
  <g transform="translate(60, 130)">
    <rect width="360" height="320" rx="18" fill="url(#glass-card)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <rect x="20" y="20" width="130" height="22" rx="6" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1"/>
    <text x="85" y="35" class="badge" fill="#38BDF8" text-anchor="middle">1. REAL INGESTION</text>
    
    <text x="20" y="68" class="card-title">Real Markdown ADR + Git Push</text>
    <text x="20" y="88" class="card-sub">No fake UI buttons. Real files committed to repo.</text>

    <!-- File 1: ADR-001 -->
    <rect x="20" y="105" width="320" height="85" rx="10" fill="#0B132B" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)"/>
    <text x="35" y="128" class="code" fill="#94A3B8">ADR-001.md (Initial State)</text>
    <text x="35" y="148" class="code" fill="#F8FAFC">status: ACCEPTED</text>
    <text x="35" y="166" class="code" fill="#38BDF8">claim: "Use TokenAuth v1 for Payment"</text>

    <!-- File 2: ADR-002 (Mutating Event) -->
    <rect x="20" y="205" width="320" height="95" rx="10" fill="#1E1B4B" fill-opacity="0.8" stroke="#818CF8" stroke-width="1.5"/>
    <text x="35" y="228" class="code" fill="#A5B4FC">ADR-002.md (Real Invalidation Event)</text>
    <text x="35" y="248" class="code" fill="#F43F5E">supersedes: ADR-001</text>
    <text x="35" y="266" class="code" fill="#34D399">claim: "OAuth2 Enforced; v1 Decommissioned"</text>
    <text x="35" y="284" class="code" fill="#A5B4FC">&gt; Parsed via 40-line Node.js Frontmatter Parser</text>
  </g>

  <!-- Connection: Stage 1 -> Stage 2 -->
  <path d="M 420 290 L 490 290" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>

  <!-- ================= STAGE 2: FALKORDB TEMPORAL GRAPH ================= -->
  <g transform="translate(500, 130)">
    <rect width="440" height="480" rx="18" fill="url(#glass-card)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <rect x="20" y="20" width="170" height="22" rx="6" fill="#6366F1" fill-opacity="0.25" stroke="#818CF8" stroke-width="1"/>
    <text x="105" y="35" class="badge" fill="#A5B4FC" text-anchor="middle">2. FALKORDB CAUSAL DAG</text>
    
    <text x="20" y="68" class="card-title">Live Temporal Dependency Graph</text>
    <text x="20" y="88" class="card-sub">Multi-Hop Traversal: Source &gt; Fact &gt; Decision</text>

    <!-- Node 1: ADR-001 (SUPERSEDED) -->
    <rect x="25" y="110" width="180" height="60" rx="8" fill="#450A0A" fill-opacity="0.85" stroke="#EF4444" stroke-width="1.5" filter="url(#glow-red)"/>
    <text x="35" y="132" class="code" fill="#FCA5A5">:Source {id: 'ADR-001'}</text>
    <text x="35" y="152" class="code" fill="#EF4444">status: 'SUPERSEDED'</text>

    <!-- Node 2: ADR-002 (ACTIVE) -->
    <rect x="235" y="110" width="180" height="60" rx="8" fill="#064E3B" fill-opacity="0.85" stroke="#10B981" stroke-width="1.5" filter="url(#glow-green)"/>
    <text x="245" y="132" class="code" fill="#A7F3D0">:Source {id: 'ADR-002'}</text>
    <text x="245" y="152" class="code" fill="#10B981">status: 'ACTIVE'</text>

    <!-- Edge: ADR-002 -[:SUPERSEDES]-> ADR-001 -->
    <path d="M 235 140 L 210 140" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="220" y="130" class="badge" fill="#F43F5E" text-anchor="middle" font-size="8">SUPERSEDES</text>

    <!-- Node 3: Fact Auth v1 (STALE) -->
    <rect x="25" y="210" width="180" height="65" rx="8" fill="#450A0A" fill-opacity="0.85" stroke="#EF4444" stroke-width="1.5"/>
    <text x="35" y="232" class="code" fill="#FCA5A5">:Fact {id: 'F-Auth-v1'}</text>
    <text x="35" y="250" class="code" fill="#EF4444">is_stale: true (FLIPPED)</text>
    <text x="35" y="265" class="code" fill="#94A3B8">[:EXTRACTED_FROM]</text>

    <!-- Node 4: Fact OAuth2 (FRESH) -->
    <rect x="235" y="210" width="180" height="65" rx="8" fill="#064E3B" fill-opacity="0.85" stroke="#10B981" stroke-width="1.5"/>
    <text x="245" y="232" class="code" fill="#A7F3D0">:Fact {id: 'F-OAuth2'}</text>
    <text x="245" y="250" class="code" fill="#10B981">is_stale: false</text>
    <text x="245" y="265" class="code" fill="#94A3B8">[:EXTRACTED_FROM]</text>

    <!-- Edges from Source -> Fact -->
    <path d="M 115 170 L 115 205" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <path d="M 325 170 L 325 205" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Node 5: Decision 102 (INVALIDATED) -->
    <rect x="25" y="315" width="180" height="70" rx="8" fill="#450A0A" fill-opacity="0.9" stroke="#EF4444" stroke-width="1.8" filter="url(#glow-red)"/>
    <text x="35" y="337" class="code" fill="#FCA5A5">:Decision {id: 'DEC-102'}</text>
    <text x="35" y="355" class="code" fill="#EF4444">status: 'INVALIDATED'</text>
    <text x="35" y="372" class="code" fill="#FCA5A5">&gt; Needs Revalidation</text>

    <!-- Node 6: Decision 103 (ACT IV REVALIDATED) -->
    <rect x="235" y="315" width="180" height="70" rx="8" fill="#064E3B" fill-opacity="0.9" stroke="#10B981" stroke-width="1.8" filter="url(#glow-green)"/>
    <text x="245" y="337" class="code" fill="#A7F3D0">:Decision {id: 'DEC-103'}</text>
    <text x="245" y="355" class="code" fill="#10B981">status: 'VALID'</text>
    <text x="245" y="372" class="code" fill="#6EE7B7">&gt; Act IV Resolved</text>

    <!-- Edges: Fact -> Decision -->
    <path d="M 115 275 L 115 310" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <path d="M 325 275 L 325 310" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Edge: DEC-103 -[:REPLACES]-> DEC-102 -->
    <path d="M 235 350 L 210 350" stroke="#34D399" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
    <text x="220" y="342" class="badge" fill="#34D399" text-anchor="middle" font-size="8">REPLACES</text>

    <!-- Invalidation Cascade Banner -->
    <rect x="25" y="405" width="390" height="55" rx="8" fill="#18181B" stroke="#F59E0B" stroke-width="1"/>
    <text x="35" y="425" class="code" fill="#FBBF24">QUERY 2 CASCADE: &lt; 3.8 ms</text>
    <text x="35" y="445" class="card-sub" fill="#CBD5E1">FalkorDB GraphBLAS instantly flipped all dependent nodes.</text>
  </g>

  <!-- Connection: Stage 2 -> Stage 3 -->
  <path d="M 940 370 L 1010 370" stroke="#00F0FF" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <!-- ================= STAGE 3: ENCLOSED MCP GATE ================= -->
  <g transform="translate(1020, 130)">
    <rect width="360" height="480" rx="18" fill="url(#glass-card)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <rect x="20" y="20" width="180" height="22" rx="6" fill="#0E7490" fill-opacity="0.3" stroke="#00F0FF" stroke-width="1"/>
    <text x="110" y="35" class="badge" fill="#00F0FF" text-anchor="middle">3. ENCLOSED MCP GATE</text>
    
    <text x="20" y="68" class="card-title">apply_code_change() Proxy</text>
    <text x="20" y="88" class="card-sub">Pre-Execution Internal Verification Check</text>

    <!-- Internal Cypher Execution Box -->
    <rect x="20" y="110" width="320" height="100" rx="10" fill="#082F49" fill-opacity="0.8" stroke="#0284C7" stroke-width="1.2"/>
    <text x="30" y="132" class="code" fill="#38BDF8">QUERY 1: INTERNAL CHECK</text>
    <text x="30" y="152" class="code" fill="#E2E8F0">ANY(dep IN deps WHERE</text>
    <text x="30" y="170" class="code" fill="#E2E8F0"> dep.fact_stale == true) -&gt; BLOCK</text>
    <text x="30" y="190" class="code" fill="#00F0FF">&gt; 100% Deterministic Policy Check</text>

    <!-- Branch A: HARD BLOCK -->
    <rect x="20" y="230" width="320" height="105" rx="10" fill="url(#glass-card-alert)" stroke="#EF4444" stroke-width="2" filter="url(#glow-red)"/>
    <text x="35" y="254" class="card-title" fill="#FCA5A5">⛔ HARD REJECT: ACTION BLOCKED</text>
    <text x="35" y="274" class="code-red">Zero files written to disk.</text>
    <text x="35" y="292" class="code-red">Path: ADR-002 &gt; Fact-Auth-v1 &gt; DEC-102</text>
    <text x="35" y="312" class="code-red">Reason: Grounding Fact invalidated.</text>

    <!-- Branch B: APPROVED -->
    <rect x="20" y="355" width="320" height="105" rx="10" fill="url(#glass-card-success)" stroke="#10B981" stroke-width="2" filter="url(#glow-green)"/>
    <text x="35" y="379" class="card-title" fill="#6EE7B7">✅ APPROVED: SAFE EXECUTION</text>
    <text x="35" y="399" class="code-green">Target: DEC-103 (OAuth2)</text>
    <text x="35" y="417" class="code-green">Code written: src/services/payment.js</text>
    <text x="35" y="437" class="code-green">Logged Action node in FalkorDB.</text>
  </g>

  <!-- ================= STAGE 4: ACT IV REVALIDATION LOOP ================= -->
  <g transform="translate(60, 640)">
    <rect width="1320" height="230" rx="18" fill="url(#glass-card)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    
    <rect x="25" y="20" width="220" height="24" rx="6" fill="#059669" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="135" y="36" class="badge" fill="#6EE7B7" text-anchor="middle">4. ACT IV: THE REVALIDATION LOOP</text>
    
    <text x="25" y="70" class="card-title">Closing the Autonomous Loop: How the Agent Safely Recovers</text>
    <text x="25" y="92" class="card-sub">When an action is blocked, the agent reads the rejection audit path, synthesizes the superseding decision, and re-executes safely.</text>

    <!-- Step 1 in Loop -->
    <rect x="25" y="115" width="280" height="90" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.1)"/>
    <text x="40" y="140" class="badge" fill="#38BDF8">STEP 1: REJECTION PARSED</text>
    <text x="40" y="162" class="card-sub" fill="#F1F5F9">Agent inspects violation path:</text>
    <text x="40" y="182" class="code" fill="#FCA5A5">DEC-102 relies on dead Auth v1</text>

    <!-- Arrow Step 1 -> Step 2 -->
    <path d="M 315 160 L 350 160" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <!-- Step 2 in Loop -->
    <rect x="360" y="115" width="280" height="90" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.1)"/>
    <text x="375" y="140" class="badge" fill="#A855F7">STEP 2: READ SUPERSEDING ADR</text>
    <text x="375" y="162" class="card-sub" fill="#F1F5F9">Reads ADR-002.md:</text>
    <text x="375" y="182" class="code" fill="#A5B4FC">Learns OAuth2 is now mandated</text>

    <!-- Arrow Step 2 -> Step 3 -->
    <path d="M 650 160 L 685 160" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- Step 3 in Loop -->
    <rect x="695" y="115" width="290" height="90" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.1)"/>
    <text x="710" y="140" class="badge" fill="#F59E0B">STEP 3: EXECUTE QUERY 3</text>
    <text x="710" y="162" class="card-sub" fill="#F1F5F9">Creates DEC-103 in FalkorDB:</text>
    <text x="710" y="182" class="code" fill="#FCD34D">(DEC-103)-[:REPLACES]-&gt;(DEC-102)</text>

    <!-- Arrow Step 3 -> Step 4 -->
    <path d="M 995 160 L 1030 160" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Step 4 in Loop -->
    <rect x="1040" y="115" width="250" height="90" rx="10" fill="#022C22" stroke="#10B981" stroke-width="1.5" filter="url(#glow-green)"/>
    <text x="1055" y="140" class="badge" fill="#34D399">STEP 4: RE-CALL GATE</text>
    <text x="1055" y="162" class="card-sub" fill="#F1F5F9">apply_code_change(DEC-103)</text>
    <text x="1055" y="185" class="code-green">STATUS: ✅ 100% APPROVED</text>
  </g>
</svg>
