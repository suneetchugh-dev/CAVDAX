# CAVDAX Nginx Production Configuration
# Alternative to Caddy for standard Nginx deployments with Certbot SSL.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream containers
    upstream backend_api {
        server server:3000;
        keepalive 32;
    }

    upstream frontend_client {
        server client:5173;
        keepalive 32;
    }

    server {
        listen 80;
        server_name cavdax.sahnirmaan.live;

        # Redirect HTTP to HTTPS (unless handled by Cloudflare Flexible)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name cavdax.sahnirmaan.live;

        # SSL Certificates (managed via Certbot or Cloudflare Origin CA)
        ssl_certificate /etc/letsencrypt/live/cavdax.sahnirmaan.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cavdax.sahnirmaan.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Real-time Server-Sent Events (SSE) - Unbuffered Streaming
        location /api/events {
            proxy_pass http://backend_api/api/events;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for instant SSE pushes
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 24h;
        }

        # 2. REST API Endpoints
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Frontend Web HUD (Reverse Proxy to Dev / SSR or Static SPA Fallback)
        # Note: If serving pre-built static assets directly via Nginx, use:
        # root /app/dist;
        # try_files $uri $uri/ /index.html;
        location / {
            proxy_pass http://frontend_client;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
