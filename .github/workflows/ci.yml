name: CAVDAX CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build:
    name: Build & Benchmark Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd apps/client
          npm ci

      - name: Build Web HUD (Vite)
        run: |
          cd apps/client
          npm run build

      - name: Run Empirical 10-Scenario Benchmark
        run: |
          node benchmark/evaluate.js

      - name: Verify Scale Generator Logic
        run: |
          node -e "import('./benchmark/scale_generator.js').then(() => console.log('Scale generator syntax verified.'))"

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q
          docker compose -f infra/docker-compose.prod.yml config -q
