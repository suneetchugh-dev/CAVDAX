name: CAVDAX Causal Invalidation Gate

on:
  pull_request:
    branches: [main, master, frontend, backend]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  causal-verification:
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CAVDAX Causal Gatekeeper
        uses: ./
        with:
          falkordb_host: localhost
          falkordb_port: 6379
