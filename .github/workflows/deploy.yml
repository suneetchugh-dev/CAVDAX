name: Deploy to Production VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="${{ secrets.VM_APP_DIR || '/home/ec2-user/CAVDAX' }}"
            eval APP_DIR_EXP="$APP_DIR"
            echo "==> Navigating to $APP_DIR_EXP..."
            cd "$APP_DIR_EXP"
            echo "==> Pulling latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            echo "==> Building updated containers sequentially (zero-downtime rolling reload)..."
            if docker compose version >/dev/null 2>&1; then
              echo "==> Building server container..."
              docker compose -f infra/docker-compose.prod.yml build server
              echo "==> Building client container..."
              docker compose -f infra/docker-compose.prod.yml build client
              echo "==> Performing rolling container recreation..."
              docker compose -f infra/docker-compose.prod.yml up -d --remove-orphans
            else
              echo "==> Building server container..."
              docker-compose -f infra/docker-compose.prod.yml build server
              echo "==> Building client container..."
              docker-compose -f infra/docker-compose.prod.yml build client
              docker-compose -f infra/docker-compose.prod.yml up -d --remove-orphans
            fi
            echo "==> Pruning dangling docker images..."
            docker image prune -f || true
            echo "==> Deployment successfully finished with zero downtime!"
