name: Deploy to Production VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.VM_APP_DIR || '/home/ec2-user/CAVDAX' }}"
            eval APP_DIR_EXP="$APP_DIR"
            echo "==> Navigating to $APP_DIR_EXP..."
            cd "$APP_DIR_EXP"
            echo "==> Pulling latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            echo "==> Rebuilding and restarting production containers with reverse proxy..."
            docker rm -f cavdax-client cavdax-server cavdax-falkordb cavdax-caddy 2>/dev/null || true
            if docker compose version >/dev/null 2>&1; then
              docker compose -f infra/docker-compose.prod.yml up -d --build --remove-orphans
            else
              docker-compose -f infra/docker-compose.prod.yml up -d --build --remove-orphans
            fi
            echo "==> Deployment successfully finished!"
