name: Deploy to Production VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Quality Gate Tests
        run: |
          node --test apps/server/test/*.mjs

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="${{ secrets.VM_APP_DIR || '/home/ec2-user/CAVDAX' }}"
            eval APP_DIR_EXP="$APP_DIR"
            echo "==> Navigating to $APP_DIR_EXP..."
            cd "$APP_DIR_EXP"
            echo "==> Pulling latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            echo "==> Synchronizing production environment secrets..."
            touch .env
            update_env_var() {
              local k="$1"
              local v="$2"
              if [ -n "$v" ]; then
                if grep -q "^${k}=" .env 2>/dev/null; then
                  sed -i "s|^${k}=.*|${k}=${v}|" .env
                else
                  echo "${k}=${v}" >> .env
                fi
              fi
            }
            update_env_var "EMAIL_ENABLED" "${{ secrets.EMAIL_ENABLED || 'true' }}"
            update_env_var "EMAIL_FROM" "${{ secrets.EMAIL_FROM || 'Sahnirmaan <no-reply@sahnirmaan.live>' }}"
            update_env_var "RESEND_API_KEY" "${{ secrets.RESEND_API_KEY }}"
            update_env_var "EMAIL_PROVIDER" "${{ secrets.EMAIL_PROVIDER || 'resend' }}"
            echo "==> Checking swap space for memory stability..."
            SWAP_SIZE=$(free -m | awk '/^Swap:/ {print $2}')
            if [ -z "$SWAP_SIZE" ] || [ "$SWAP_SIZE" -lt 1024 ]; then
              echo "==> Configuring 2GB persistent swapfile on t3.micro..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile 2>/dev/null || true
              sudo swapon /swapfile 2>/dev/null || true
              if ! grep -q '/swapfile' /etc/fstab 2>/dev/null; then
                echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              fi
              echo "==> Swap space enabled:"
              free -m
            fi
            echo "==> Building updated containers sequentially (zero-downtime rolling reload)..."
            
            deploy_service() {
              local svc="$1"
              local count=0
              echo "==> Deploying $svc container..."
              until docker compose -f infra/docker-compose.prod.yml up -d --no-deps "$svc" 2>/dev/null || [ $count -ge 4 ]; do
                echo "==> Docker daemon busy removing $svc, waiting 3s for unmount before retry $((count + 1))/4..."
                sleep 3
                count=$((count + 1))
              done
              if [ $count -ge 4 ]; then
                # Final attempt without error suppression if all retries failed
                docker compose -f infra/docker-compose.prod.yml up -d --no-deps "$svc"
              fi
            }

            if docker compose version >/dev/null 2>&1; then
              echo "==> Building server container..."
              docker compose -f infra/docker-compose.prod.yml build server
              echo "==> Building client container..."
              docker compose -f infra/docker-compose.prod.yml build client
              echo "==> Performing rolling container recreation..."
              deploy_service server
              deploy_service client
            else
              echo "==> Building with legacy docker-compose..."
              docker-compose -f infra/docker-compose.prod.yml build server
              docker-compose -f infra/docker-compose.prod.yml build client
              docker-compose -f infra/docker-compose.prod.yml up -d --no-deps server
              docker-compose -f infra/docker-compose.prod.yml up -d --no-deps client
            fi
            echo "==> Cleaning up dangling build images to preserve disk space..."
            docker image prune -f
            echo "==> CAVDAX Deployment successfully completed!"
