name: Deploy Knowledge Graph to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'core/**'
      - 'apps/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  deploy-graph:
    name: Build & Publish Knowledge Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          pip install graphifyy

      - name: Extract Graph & Apply CAVDAX Design System
        run: |
          mkdir -p graphify-out
          graphify . --no-viz || true
          graphify export html || true
          python scripts/generate_cavdax_graph_html.py || true
          # Guarantee index.html exists in publish directory
          if [ -f graphify-out/graph.html ] && [ ! -f graphify-out/index.html ]; then
            cp graphify-out/graph.html graphify-out/index.html
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: graphify-out
          publish_branch: gh-pages
          destination_dir: ''
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
